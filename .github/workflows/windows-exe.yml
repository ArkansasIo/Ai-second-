name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable EXE
        run: npm run desktop:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-second-brain-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
