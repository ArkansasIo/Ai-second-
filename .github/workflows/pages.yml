name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify release version
        run: |
          node -e "const p=require('./package.json'); if(p.version !== process.env.APP_VERSION) { throw new Error('Version mismatch: package.json=' + p.version + ' expected=' + process.env.APP_VERSION); }"
          node -e "const fs=require('node:fs'); const version=fs.readFileSync('VERSION','utf8').trim(); if(version !== process.env.APP_VERSION) { throw new Error('VERSION file=' + version + ' expected=' + process.env.APP_VERSION); }"
      - name: Build web application
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
