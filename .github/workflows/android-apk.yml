name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify application version
        run: node -e "const p=require('./package.json'); const fs=require('fs'); const v=fs.readFileSync('VERSION','utf8').trim(); if(p.version!==v) throw new Error('Version mismatch: package='+p.version+' VERSION='+v); console.log('Building AI Second Brain '+v);"

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web application into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/AI-Second-Brain-${{ github.ref_name }}-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/android/AI-Second-Brain-${{ github.ref_name }}-release-unsigned.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-second-brain-android
          path: artifacts/android/*.apk
          if-no-files-found: error
